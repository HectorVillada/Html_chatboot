<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado XYZ - Tienda Completa</title>
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

    <style>
        :root {
            --primary: #2ecc71;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light); }
        
        /* Navegación y Carrito */
        nav { background: var(--dark); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .cart-icon { cursor: pointer; position: relative; font-size: 1.2rem; }
        .cart-count { background: var(--primary); color: white; border-radius: 50%; padding: 2px 8px; font-size: 0.8rem; position: absolute; top: -10px; right: -15px; }

        header { background: var(--primary); color: white; padding: 3rem 1rem; text-align: center; }

        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        
        /* Grid de Productos */
        .productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .card h3 { font-size: 1.1rem; margin: 10px 0; }
        .precio { color: var(--primary); font-weight: bold; font-size: 1.2rem; display: block; margin-bottom: 10px; }
        
        .btn-add { background: var(--primary); color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-add:hover { background: #27ae60; }

        /* Estilos del Chat */
        .n8n-chat-widget { z-index: 9999 !important; }
    </style>
</head>
<body>

    <nav>
        <strong>🛒 Supermercado XYZ</strong>
        <div class="cart-icon">
            Carrito <span class="cart-count" id="cart-count">0</span>
        </div>
    </nav>

    <header>
        <h1>Frutas, Verduras y Más</h1>
        <p>Selecciona tus productos y chatea con nuestro asistente para el envío</p>
    </header>

    <div class="container">
        <div class="productos" id="lista-productos">
            </div>
    </div>

    <script>
        const productos = [
            { id: 1, nombre: "Pack Frutas 5kg", precio: 15000, img: "https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=300" },
            { id: 2, nombre: "Leche Entera x6", precio: 27000, img: "https://images.unsplash.com/photo-1550583724-125581f77833?w=300" },
            { id: 3, nombre: "Pan Artesanal", precio: 4200, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" },
            { id: 4, nombre: "Huevos AA x30", precio: 18000, img: "https://images.unsplash.com/photo-1518569190581-081e79603096?w=300" },
            { id: 5, nombre: "Arroz Integral 1kg", precio: 5500, img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300" },
            { id: 6, nombre: "Aguacate Hass kg", precio: 8500, img: "https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=300" },
            { id: 7, nombre: "Café Molido 500g", precio: 12000, img: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=300" },
            { id: 8, nombre: "Aceite Oliva 500ml", precio: 22000, img: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=300" }
        ];

        let carrito = [];

        function renderProductos() {
            const container = document.getElementById('lista-productos');
            container.innerHTML = productos.map(p => `
                <div class="card">
                    <img src="${p.img}" alt="${p.nombre}">
                    <h3>${p.nombre}</h3>
                    <span class="precio">$${p.precio.toLocaleString()}</span>
                    <button class="btn-add" onclick="agregarAlCarrito(${p.id})">Agregar</button>
                </div>
            `).join('');
        }

        window.agregarAlCarrito = function(id) {
            const producto = productos.find(p => p.id === id);
            carrito.push(producto);
            document.getElementById('cart-count').innerText = carrito.length;
            
            // Efecto visual simple
            alert(`✅ ${producto.nombre} añadido al carrito`);
        }

        renderProductos();
    </script>

    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

        createChat({
            webhookUrl: 'https://franklin1032.app.n8n.cloud/webhook/a62723ca-c978-4383-85ec-77d2ac0e7e94/chat',
            title: 'Asistente Supermercado XYZ',
            subtitle: 'Chat de Pedidos',
            initialMessages: [
                '¡Hola! 👋 Veo que estás armando tu carrito.',
                'Cuando termines, dime "Finalizar pedido" y te ayudaré con el pago y domicilio.'
            ],
            i18n: {
                en: { placeholder: '¿Tienes dudas sobre los productos?' }
            }
        });
    </script>
</body>
</html>
