<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado XYZ - Tienda Virtual</title>
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

    <style>
        /* Estilos de la Tienda */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        header { background: #2ecc71; color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 20px; }
        .productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .precio { color: #27ae60; font-weight: bold; font-size: 1.4rem; margin: 10px 0; }
        button { background: #2ecc71; border: none; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Ajustes para evitar que el chat se bloquee */
        :root {
            --n8n-chat-primary-color: #2ecc71;
            --n8n-chat-button-background: #2ecc71;
        }
        /* Asegura que el widget esté sobre todo lo demás */
        .n8n-chat-widget {
            z-index: 999999 !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛒 Supermercado XYZ</h1>
        <p>Calidad y frescura en la puerta de tu casa</p>
    </header>

    <div class="container">
        <h2>Productos en Oferta</h2>
        <div class="productos">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1550989460-0adf9ea622e2?w=400" alt="Frutas">
                <h3>Pack Frutas Frescas</h3>
                <p>Variedad de temporada 5kg</p>
                <p class="precio">$15.000</p>
                <button>Agregar al Carrito</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1550583724-125581f77833?w=400" alt="Leche">
                <h3>Leche Entera Premium</h3>
                <p>Caja de 6 unidades</p>
                <p class="precio">$27.000</p>
                <button>Agregar al Carrito</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400" alt="Pan">
                <h3>Pan Artesanal Hoy</h3>
                <p>Recién horneado</p>
                <p class="precio">$4.200</p>
                <button>Agregar al Carrito</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

        createChat({
            webhookUrl: 'https://franklin1032.app.n8n.cloud/webhook/a62723ca-c978-4383-85ec-77d2ac0e7e94/chat',
            title: 'Asistente Supermercado XYZ',
            subtitle: 'Estamos en línea',
            initialMessages: [
                '¡Hola! 👋 Bienvenido a Supermercado XYZ.',
                '¿Buscas algún producto en especial o quieres consultar tu domicilio?'
            ],
            i18n: {
                en: {
                    placeholder: 'Escribe tu mensaje aquí...',
                    sendButtonAriaLabel: 'Enviar mensaje',
                }
            }
        });
    </script>
</body>
</html>
